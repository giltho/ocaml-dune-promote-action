name: 'Dune Promote Action'
description: 'Automatically run dune test --auto-promote and commit the changes'
author: 'giltho'

inputs:
  github-token:
    description: 'GitHub token for committing and pushing changes'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Run dune test --auto-promote
      shell: bash
      run: |
        echo "Running dune test --auto-promote..."
        # dune test --auto-promote may exit with non-zero if tests fail before promotion
        # We capture the exit code but don't fail the step
        dune test --auto-promote || echo "Tests completed with exit code $?, checking for promoted changes..."
        
    - name: Check for changes
      id: check-changes
      shell: bash
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected after dune promote"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        fi
        
    - name: Commit and push changes
      if: steps.check-changes.outputs.changes == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Show what files will be committed
        echo "Files to be committed:"
        git status --short
        
        # Add all modified and new files (dune promote may create new test output files)
        git add -A
        
        # Commit the changes
        git commit -m "Auto-promote dune test changes"
        
        # Push to the current branch
        git push origin HEAD
        
        echo "Changes committed and pushed successfully"

branding:
  icon: 'check-circle'
  color: 'orange'
